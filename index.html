><rect x=\"-24\" y=\"-9\" width=\"48\" height=\"18\" rx=\"9\"/><rect x=\"-8\" y=\"-9\" width=\"16\" height=\"18\"/></g>"};
{const bg=document.createElement('div');bg.id='bg';
bg.innerHTML='<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="-34" y1="-34" x2="34" y2="34"><stop offset="0" stop-color="#3aa592"/><stop offset="1" stop-color="#2f6fb0"/></linearGradient></defs></svg>';
const nm=Object.keys(IC),R=(a,b)=>a+Math.random()*(b-a);let k=0;
for(let r=0;r<4;r++)for(let c=0;c<6;c++){const w=document.createElement('div'),z=R(46,84);w.className='w';w.dataset.d=Math.round(R(14,70));
 w.style.cssText=`left:${(c*16.6+R(0,9)).toFixed(1)}%;top:${(r*25+R(0,10)).toFixed(1)}%;width:${z}px`;
 w.innerHTML=`<div class="i" style="--t:${R(7,13).toFixed(1)}s;--dl:-${R(0,12).toFixed(1)}s;--r:${Math.round(R(-14,14))}deg"><svg viewBox="-36 -36 72 72">${IC[nm[k++%nm.length]]}</svg></div>`;bg.appendChild(w)}
try{if(localStorage.getItem('mo')==='0')bg.classList.add('nomo')}catch(e){}
document.body.prepend(bg);
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;bg.querySelectorAll('.w').forEach(w=>w.style.transform=`translate3d(${-x*w.dataset.d}px,${-y*w.dataset.d}px,0)`)},{passive:true})}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'),today=()=>fmt(new Date());
if(!firebaseConfig.apiKey){$('#app').innerHTML='<div class="card"><h2>Setup needed</h2><p>Paste your Firebase config into index.html.</p></div>';throw 0}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const OWNER='tigerswapsky@gmail.com',C=n=>collection(db,n);
let me=null,uid=null,tab='mine',reg=false,msg='',isOwner=false,em='',month=today().slice(0,7),photoData=null;

const apprs=()=>(me.reportsTo&&me.reportsTo.length)?me.reportsTo:[OWNER];

async function notify(type,id){try{if(!MAIL_URL){toast('⚠️','Email service is not connected (MAIL_URL is empty).');return}
 const token=await auth.currentUser.getIdToken(),r=await fetch(MAIL_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({type,id,token})}),t=(await r.text()).trim();
 if(t!=='ok')toast('⚠️','Email not sent: '+t.slice(0,120))}catch(e){toast('⚠️','Email request failed: '+e.message)}}
const xl=async(sheets,name)=>{if(!window.XLSX)await new Promise((r,j)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=r;s.onerror=j;document.head.appendChild(s)});
 const wb=XLSX.utils.book_new();Object.entries(sheets).forEach(([n,r])=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(r),n));XLSX.writeFile(wb,name)};
const LH=['Name','Email','Post','Department','Type','From','To','Days','Reason','Status','Decided by'],LR=l=>[l.name,l.email,l.post||'',l.dept||'',l.type,l.from,l.to,days(l),l.note||'',l.status,l.decidedBy||''];

 uid=u.uid;em=u.email.toLowerCase();const s=await getDoc(doc(db,'users',uid));if(!s.exists()){msg='Profile not found. Ask HR.';await signOut(auth);return}
 me=s.data();isOwner=em===OWNER&&u.emailVerified;
 if(em===OWNER&&!u.emailVerified){sendEmailVerification(u).catch(()=>{});alert('A verification email was sent to '+u.email+'. Click the link in it, then sign in again to get HR powers.')}

async function mine(){
 const ls=(await get(query(C('leaves'),where('uid','==',uid)))).sort((a,b)=>a.from<b.from?1:-1),u=used(ls),al=me.allow??21;
 return `<div class="card"><h2>Hello, ${esc(me.name)}</h2><span class="big">${al-u}</span> <span class="mu">days of leave left this year (${u} used of ${al})</span></div>

const canDecide=l=>l.uid!==uid&&l.status==='Pending'&&!l.head&&(isOwner||(l.approvers||[]).includes(em));
async function team(){
 const [ls,us]=await Promise.all([get(isOwner?query(C('leaves')):query(C('leaves'),where('approvers','array-contains',em))),get(isOwner?query(C('users')):query(C('users'),where('reportsTo','array-contains',em)))]);
 const t=today(),ats=await Promise.all(us.map(u=>getDoc(doc(db,'attendance',t+'_'+u.id)))),at={};ats.forEach((s,i)=>{if(s.exists())at[us[i].id]=s.data()});
 const pend=ls.filter(l=>l.status==='Pending'),hist=ls.filter(l=>l.status!=='Pending').sort((a,b)=>a.from<b.from?1:-1).slice(0,100);

 return `<div class="card"><h2>Waiting for approval (${pend.length})</h2>${pend.length?`<div class="tw"><table><tr><th>Name</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th></th></tr>${pend.map(l=>`<tr>${row(l)}<td>${canDecide(l)?`<button class="b s" data-a="set" data-k="${l.id}" data-v="Approved">Approve</button> <button class="b s g" data-a="set" data-k="${l.id}" data-v="Rejected">Reject</button>`:'<span class="mu">View only</span>'}</td></tr>`).join('')}</table></div>`:'<p class="mu">Nothing waiting.</p>'}</div>
 <div class="card"><h2>Today</h2><div class="tw"><table><tr><th>Name</th><th>Department</th><th>Status</th><th>Time</th></tr>${us.sort((a,b)=>a.name<b.name?-1:1).map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.dept||'')}</td><td>${st(u)}</td><td>${tm((at[u.id]||{}).at)}</td></tr>`).join('')}</table></div></div>
 <div class="card"><h2>Leave history</h2>${hist.length?`<div class="tw"><table><tr><th>Name</th><th>Type</th><th>Dates</th><th>Days</th><th>Reason</th><th>Status</th></tr>${hist.map(l=>`<tr>${row(l)}<td>${tag(l.status)}</td></tr>`).join('')}</table></div>`:'<p class="mu">No history yet.</p>'}</div>`}

async function hol(){const e=Object.entries(HOL).sort();return `<div class="card"><h2>Holidays 2026</h2><div class="tw"><table><tr><th>Date</th><th>Day</th><th>Holiday</th></tr>${e.map(([d,n])=>`<tr><td>${d}</td><td>${new Date(d+'T00:00').toLocaleDateString('en-IN',{weekday:'long'})}</td><td>${esc(n)}</td></tr>`).join('')}</table></div><p class="mu">Saturdays and Sundays are weekly offs.</p></div>`}

let rep=[];
async function report(){
 const [us,ls,at]=await Promise.all([get(query(C('users'))),get(query(C('leaves'))),get(query(C('attendance'),where('date','>=',month+'-01'),where('date','<=',month+'-31')))]);
 const [y,m]=month.split('-').map(Number),n=new Date(y,m,0).getDate(),t=today();
 rep=us.sort((a,b)=>a.name<b.name?-1:1).map(u=>{const c={Present:0,Late:0,'Half day':0,Leave:0,Absent:0};
  for(let i=1;i<=n;i++){const d=month+'-'+String(i).padStart(2,'0');if(d>t||off(d))continue;const a=at.find(x=>x.uid===u.id&&x.date===d);if(a){c[a.status]++;continue}
   const l=ls.find(x=>x.uid===u.id&&x.status==='Approved'&&x.from<=d&&d<=x.to);if(l)c.Leave+=l.half?.5:1;else c.Absent++}
  return [u.name,u.post||'',u.dept||'',c.Present,c.Late,c['Half day'],c.Leave,c.Absent,(u.allow??21)-used(ls.filter(l=>l.uid===u.id))]});
 return `<div class="card"><h2>Monthly report</h2><div class="row"><label>Month<input type="month" id="rm" value="${month}"></label><button class="b" data-a="dlrep">Download Excel</button></div>
 <div class="tw"><table><tr><th>Name</th><th>Post</th><th>Department</th><th>Present</th><th>Late</th><th>Half day</th><th>Leave</th><th>Absent</th><th>Leave left</th></tr>${rep.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</table></div>
 <p class="mu">Weekends and holidays are not counted. A working day with no check-in and no approved leave counts as Absent.</p></div>`}

let PU=[];
async function people(){
 PU=(await get(query(C('users')))).sort((a,b)=>a.name<b.name?-1:1);const nm={};PU.forEach(u=>nm[(u.email||'').toLowerCase()]=u.name);
 const cb=(u,t,l)=>`<label style="flex-direction:row;gap:3px;align-items:center"><input type="checkbox" class="tb" data-t="${t}" ${(u.tabs||[]).includes(t)?'checked':''}>${l}</label>`;
 return `<div class="card"><div class="row"><h2 style="margin:0">People (HR)</h2><button class="b s g" data-a="dlall">⬇ Download all data (Excel)</button></div><p class="mu">Edit details, tab access and the approval line. ✏ changes who a person's leave goes to. Tick "ED/head" for a person whose leave needs no approval.</p>
 <div class="tw"><table><tr><th>Name</th><th>Designation</th><th>Department</th><th>Allowance</th><th>Approval goes to</th><th>Access</th><th>Head</th><th></th></tr>
 ${PU.map(u=>`<tr data-u="${u.id}"><td><input class="nm" value="${esc(u.name)}"><div class="mu">${esc(u.email||'')} · ${esc(u.mobile||'')}</div></td><td><input class="po" value="${esc(u.post||'')}"></td><td><input class="de" value="${esc(u.dept||'')}"></td>
 <td><input class="al" type="number" min="0" style="width:70px" value="${u.allow??21}"></td><td>${(u.reportsTo&&u.reportsTo.length?u.reportsTo.map(e=>esc(nm[e]||e)).join(', '):'HR (default)')} <button class="b s g" data-a="rl" title="Change approval line">✏</button></td>
 <td><div style="display:flex;gap:6px;flex-wrap:wrap">${cb(u,'team','Team')}${cb(u,'report','Report')}${cb(u,'holidays','Holidays')}<button class="b s g" data-a="alltabs">All</button></div></td>
 <td><input type="checkbox" class="hd" ${u.head?'checked':''}></td><td style="white-space:nowrap"><button class="b s" data-a="sp">Save</button> <button class="b s g" data-a="du">Delete</button></td></tr>`).join('')}</table></div></div>`}

const bar=()=>{};
document.addEventListener('change',async e=>{const t=e.target;
 if(t.id==='rm'&&t.value){month=t.value;show()}
 if(t.id==='ph'&&t.files[0]){const img=new Image();img.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,220/Math.max(img.width,img.height));c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.7);$('#phv').innerHTML=`<img src="${photoData}" style="width:80px;height:80px;border-radius:50%;object-fit:cover">`};img.src=URL.createObjectURL(t.files[0])}});
const mobId=async v=>{v=v.trim();if(v.includes('@'))return v;const s=await getDoc(doc(db,'phoneIndex',v.replace(/\D/g,'').slice(-10)));if(!s.exists())throw {message:'Mobile number not found.'};return s.data().email};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k,m=t=>{const x=$('#m');if(x)x.textContent=t;else alert(t)};
 try{
 if(a==='tab'){tab=k;return show()}if(a==='out')return signOut(auth);if(a==='tr')return login(1);if(a==='tl')return login();
 if(a==='eye'){const i=b.previousElementSibling;i.type=i.type==='password'?'text':'password';return}
 if(a==='mo'){const g=$('#bg');g.classList.toggle('nomo');try{localStorage.setItem('mo',g.classList.contains('nomo')?'0':'1')}catch(x){}return show()}
 if(a==='rs'){const v=$('#e').value;if(!v)return m('Type your email or mobile number first.');await sendPasswordResetEmail(auth,await mobId(v));return m('Password reset email sent.')}
 if(a==='in')await signInWithEmailAndPassword(auth,await mobId($('#e').value),$('#p').value);
 if(a==='reg'){const n=$('#n').value.trim(),mo=$('#mo').value.replace(/\D/g,''),ei=$('#e').value.trim(),p=$('#p').value;
  if(!n||!ei||!p)return m('Please fill name, email and password.');if(!/^[6-9]\d{9}$/.test(mo))return m('Enter a valid 10-digit mobile number.');
  if((await getDoc(doc(db,'phoneIndex',mo))).exists())return m('This mobile number is already registered.');
  reg=true;const c=await createUserWithEmailAndPassword(auth,ei,p);uid=c.user.uid;em=c.user.email.toLowerCase();
  me={name:n,nameLower:n.toLowerCase(),email:em,mobile:mo,post:$('#po').value.trim(),dept:$('#d').value.trim(),role:'staff',allow:21,doj:''};
  const w=writeBatch(db);w.set(doc(db,'users',uid),me);w.set(doc(db,'phoneIndex',mo),{email:em,uid});await w.commit();reg=false;isOwner=false;
  if(em===OWNER){sendEmailVerification(c.user).catch(()=>{});alert('A verification email was sent to '+em+'. Click the link in it, then sign in again to get HR powers.')}tab='mine';show()}
 if(a==='req'){const f=$('#f').value,o=$('#o').value,h=$('#h').checked;if(!f||!o||o<f)return m('Check the dates.');if(h&&f!==o)return m('Half day needs the same date.');
  const hd=!!me.head,ref=await addDoc(C('leaves'),{uid,email:em,name:me.name,post:me.post||'',dept:me.dept||'',type:$('#t').value,from:f,to:o,half:h,note:$('#r').value.trim(),status:hd?'Approved':'Pending',decidedBy:hd?'self':'',head:hd,approvers:apprs(),created:Date.now()});
  if(!hd)notify('applied',ref.id);toast('😊','Your leave request was submitted!');show()}
 if(a==='del'&&confirm('Cancel this request?')){await deleteDoc(doc(db,'leaves',k));show()}
 if(a==='dlmine'){const ls=(await get(query(C('leaves'),where('uid','==',uid)))).sort((a,b)=>a.from<b.from?1:-1);await xl({'My leave':[LH,...ls.map(LR)]},'my-leave-data.xlsx')}
 if(a==='ci'){const id=today()+'_'+uid,s=await getDoc(doc(db,'attendance',id));await setDoc(doc(db,'attendance',id),{uid,name:me.name,dept:me.dept||'',date:today(),status:k,at:s.exists()?s.data().at:Date.now(),approvers:apprs()});show()}
 if(a==='set'){await updateDoc(doc(db,'leaves',k),{status:b.dataset.v,decidedBy:em});notify('decided',k);show()}
 if(a==='ps'){const d={name:$('#pn').value.trim(),post:$('#pp').value.trim(),dept:$('#pd').value.trim(),doj:$('#pj').value};if(!d.name)return m('Name is required.');d.nameLower=d.name.toLowerCase();if(photoData)d.photo=photoData;await updateDoc(doc(db,'users',uid),d);me={...me,...d};toast('✅','Profile saved');show()}
 if(a==='dlrep')await xl({Report:[['Name','Post','Department','Present','Late','Half day','Leave','Absent','Leave left'],...rep]},'attendance-report-'+month+'.xlsx');
 if(a==='alltabs'){b.closest('tr').querySelectorAll('.tb').forEach(c=>c.checked=true);return}
 if(a==='sp'){const r=b.closest('tr'),q=s=>r.querySelector(s);await updateDoc(doc(db,'users',r.dataset.u),{name:q('.nm').value.trim(),nameLower:q('.nm').value.trim().toLowerCase(),post:q('.po').value.trim(),dept:q('.de').value.trim(),allow:+q('.al').value||0,head:q('.hd').checked,tabs:[...r.querySelectorAll('.tb:checked')].map(c=>c.dataset.t)});b.textContent='Saved'}
 if(a==='rl'){const r=b.closest('tr'),u=PU.find(x=>x.id===r.dataset.u),v=prompt('Who should approve '+u.name+'\'s leave?\nType their login email(s), separated by commas. Leave empty = HR only.',(u.reportsTo||[]).join(', '));if(v===null)return;
  const list=v.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean),w=writeBatch(db);w.update(doc(db,'users',u.id),{reportsTo:list});
  (await get(query(C('leaves'),where('uid','==',u.id),where('status','==','Pending')))).forEach(l=>w.update(doc(db,'leaves',l.id),{approvers:list.length?list:[OWNER]}));await w.commit();toast('✅','Approval line updated');show()}
 if(a==='du'){const r=b.closest('tr'),u=PU.find(x=>x.id===r.dataset.u);if(u.email&&u.email.toLowerCase()===OWNER)return alert('You cannot delete the HR account.');
  if(!confirm('Delete ALL data of '+u.name+' (profile, leaves, attendance)? This cannot be undone. Download the data first if needed.'))return;
  const w=writeBatch(db);(await get(query(C('leaves'),where('uid','==',u.id)))).forEach(l=>w.delete(doc(db,'leaves',l.id)));(await get(query(C('attendance'),where('uid','==',u.id)))).forEach(l=>w.delete(doc(db,'attendance',l.id)));
  if(u.mobile)w.delete(doc(db,'phoneIndex',u.mobile));w.delete(doc(db,'users',u.id));await w.commit();alert('Data deleted. Their login still exists: remove it in Firebase > Authentication > Users if needed.');show()}
 if(a==='dlall'){b.textContent='Preparing…';const [us,ls,at]=await Promise.all([get(query(C('users'))),get(query(C('leaves'))),get(query(C('attendance')))]);
  await xl({People:[['Name','Email','Mobile','Designation','Department','Date of joining','Allowance','Approval goes to','Head','Tab access'],...us.map(u=>[u.name,u.email||'',u.mobile||'',u.post||'',u.dept||'',u.doj||'',u.allow??21,(u.reportsTo||[]).join(', '),u.head?'Yes':'',(u.tabs||[]).join(', ')])],
   Leaves:[LH,...ls.map(LR)],Attendance:[['Name','Department','Date','Status','Time'],...at.sort((x,y)=>x.date<y.date?1:-1).map(x=>[x.name,x.dept||'',x.date,x.status,tm(x.at)])]},'shsrc-all-data-'+today()+'.xlsx');b.textContent='⬇ Download all data (Excel)'}
 }catch(x){reg=false;m(x.code==='auth/invalid-credential'?'Wrong email or password.':x.code==='auth/email-already-in-use'?'This email already has an account.':x.message)}});
</script></body></html>
